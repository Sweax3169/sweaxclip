<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236">
<style>
  .r{animation:rin .7s cubic-bezier(.2,1.25,.4,1) both}
  @keyframes rin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sel{animation:walk 7.2s cubic-bezier(.3,1.35,.45,1) infinite}
  @keyframes walk{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(52px)}50%,68%{transform:translateY(104px)}75%,93%{transform:translateY(156px)}100%{transform:translateY(0)}}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion: reduce){.r,.sel,.caret,.float{animation:none}}
</style>
<style>
  .drop{animation:drop 4.2s cubic-bezier(.25,1.3,.45,1) infinite}
  @keyframes drop{0%,12%{opacity:0;transform:translateY(-10px) scale(.96)}24%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
  .scroll{animation:scroll 18s linear infinite}
  @keyframes scroll{to{transform:translateY(-400px)}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .slide{animation:slide 8s cubic-bezier(.3,1.35,.45,1) infinite}
  @keyframes slide{0%,14%{transform:translateX(0)}20%,34%{transform:translateX(48px)}40%,54%{transform:translateX(96px)}60%,74%{transform:translateX(144px)}80%,94%{transform:translateX(192px)}100%{transform:translateX(0)}}
  .lift{animation:lift 5s cubic-bezier(.3,1.3,.5,1) infinite}
  @keyframes lift{0%,20%{transform:none}35%,80%{transform:translate(-18px,-16px) scale(1.12)}95%,100%{transform:none}}
  .flow{animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13120F"/><stop offset="1" stop-color="#0C0B0A"/></linearGradient>
  <linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1E1C"/><stop offset="1" stop-color="#171615"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#FF6A3D" stop-opacity=".22"/><stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".14"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#5CD6B4" stop-opacity=".14"/><stop offset="1" stop-color="#5CD6B4" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6A3D"/><stop offset=".4" stop-color="#F2B84B"/><stop offset=".7" stop-color="#5CD6B4"/><stop offset="1" stop-color="#7DA8FF"/></linearGradient>
</defs>
<rect width="420" height="236" rx="18" fill="url(#bg)"/>
<rect x=".5" y=".5" width="419" height="235" rx="17.5" fill="none" stroke="rgba(255,255,255,.10)"/>
<g filter="url(#sh2)"><rect x="70" y="40" width="220" height="136" rx="12" fill="#24272F"/></g>
<rect x="82" y="52" width="196" height="112" rx="6" fill="url(#pf)"/>
<rect x="150" y="182" width="60" height="10" rx="3" fill="rgba(242,239,233,.30)"/><rect x="130" y="192" width="100" height="6" rx="3" fill="rgba(242,239,233,.16)"/>
<rect x="158" y="98" width="44" height="38" rx="8" fill="#FF6A3D"/><path d="M166 98 V88 a14 14 0 0 1 28 0 V98" fill="none" stroke="#FF6A3D" stroke-width="5"/>
<circle cx="180" cy="115" r="4.5" fill="#fff"/><rect x="178" y="116" width="4" height="10" rx="2" fill="#fff"/>
<g class="pulse" transform="translate(316 86)"><path d="M6 30 a18 18 0 0 1 4-35 a22 22 0 0 1 40 6 a14 14 0 0 1 2 29 z" fill="none" stroke="rgba(242,239,233,.42)" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="-4" y1="-14" x2="60" y2="40" stroke="#FF6A3D" stroke-width="3" stroke-linecap="round"/></g>
</svg>