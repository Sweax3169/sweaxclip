name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build src/SweaxClip -c Release

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/SweaxClip -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -o out/full

      - name: Publish (framework-dependent single file)
        run: >
          dotnet publish src/SweaxClip -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -o out/lite

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, portable/SweaxClip/sweaxclip-data -Force | Out-Null
          Copy-Item out/full/SweaxClip.exe dist/SweaxClip.exe
          Copy-Item out/lite/SweaxClip.exe dist/SweaxClip-lite.exe
          Copy-Item out/full/SweaxClip.exe portable/SweaxClip/SweaxClip.exe
          "SweaxClip keeps its archive in this folder (portable mode). Move the whole SweaxClip folder to keep everything together." |
            Set-Content portable/SweaxClip/sweaxclip-data/README.txt
          Compress-Archive portable/SweaxClip dist/SweaxClip-portable.zip
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SweaxClip-${{ github.sha }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SweaxClip ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*
