<circle cx="150" cy="32" r="6" fill="none" stroke="#E4572E" stroke-width="1.8"/><line x1="154.5" y1="36.5" x2="159" y2="41" stroke="#E4572E" stroke-width="1.8" stroke-linecap="round"/>
