rect x="120" y="174" width="150" height="8" rx="4" fill="rgba(35,32,29,.12)"/><circle cx="76" cy="206" r="3.5" fill="#2F6BEA"/><rect x="92" y="196" width="20" height="20" rx="5.5" fill="#2F6BEA"/><rect x="120" y="202" width="220" height="8" rx="4" fill="rgba(35,32,29,.12)"/>
