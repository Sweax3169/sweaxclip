<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="SweaxClip architecture">
<style>
  .r{animation:rin .7s cubic-bezier(.2,1.25,.4,1) both}
  @keyframes rin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sel{animation:walk 7.2s cubic-bezier(.3,1.35,.45,1) infinite}
  @keyframes walk{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(52px)}50%,68%{transform:translateY(104px)}75%,93%{transform:translateY(156px)}100%{transform:translateY(0)}}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion: reduce){.r,.sel,.caret,.float{animation:none}}
</style>
<style>.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F5F1"/><stop offset="1" stop-color="#ECE9E3"/></linearGradient>
  <linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F6F2"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#E4572E" stop-opacity=".16"/><stop offset="1" stop-color="#E4572E" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#6D4FD8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4FD8" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#0E8F70" stop-opacity=".10"/><stop offset="1" stop-color="#0E8F70" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<rect width="1100" height="470" rx="20" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1099" height="469" rx="19.5" fill="none" stroke="rgba(35,32,29,.12)"/>
<path d="M270 125 C 335 125, 335 200, 400 200" fill="none" stroke="rgba(35,32,29,.13)" stroke-width="2"/><path class="flow" d="M270 125 C 335 125, 335 200, 400 200" fill="none" stroke="#6E675F" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/><path d="M270 345 C 335 345, 335 270, 400 270" fill="none" stroke="rgba(35,32,29,.13)" stroke-width="2"/><path class="flow" d="M270 345 C 335 345, 335 270, 400 270" fill="none" stroke="#6D4FD8" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/><path d="M700 200 C 765 200, 765 100, 830 100" fill="none" stroke="rgba(35,32,29,.13)" stroke-width="2"/><path class="flow" d="M700 200 C 765 200, 765 100, 830 100" fill="none" stroke="#2F6BEA" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/><path d="M700 235 C 765 235, 765 240, 830 240" fill="none" stroke="rgba(35,32,29,.13)" stroke-width="2"/><path class="flow" d="M700 235 C 765 235, 765 240, 830 240" fill="none" stroke="#96701E" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/><path d="M830 380 C 765 380, 765 290, 700 290" fill="none" stroke="rgba(35,32,29,.13)" stroke-width="2"/><path class="flow" d="M830 380 C 765 380, 765 290, 700 290" fill="none" stroke="#0E8F70" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round"/><g filter="url(#sh2)"><rect x="40" y="60" width="230" height="130" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="40" y="76" width="3" height="22" rx="1.5" fill="#6E675F"/><text x="60" y="93" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Windows clipboard</text><text x="60" y="118" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">AddClipboardFormatListener</text><text x="60" y="138" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">raw formats, HTML, RTF</text><text x="60" y="158" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">privacy flags honoured</text><g filter="url(#sh2)"><rect x="40" y="280" width="230" height="130" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="40" y="296" width="3" height="22" rx="1.5" fill="#6D4FD8"/><text x="60" y="313" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Screenshots folder</text><text x="60" y="338" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">FileSystemWatcher</text><text x="60" y="358" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">Win + PrtScn, Snipping Tool</text><text x="60" y="378" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">imported on first run</text><g filter="url(#sh2)"><rect x="400" y="150" width="300" height="170" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="400" y="166" width="3" height="22" rx="1.5" fill="#E4572E"/><text x="420" y="183" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Archive</text><text x="420" y="208" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">SQLite · WAL · synchronous</text><text x="420" y="228" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">FTS5 trigram index</text><text x="420" y="248" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">images stored once (SHA-256)</text><text x="420" y="268" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">daily snapshot + .zip export</text><g filter="url(#sh2)"><rect x="830" y="40" width="230" height="120" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="830" y="56" width="3" height="22" rx="1.5" fill="#2F6BEA"/><text x="850" y="73" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Win + V panel</text><text x="850" y="98" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">low-level keyboard hook</text><text x="850" y="118" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">opens at the text caret</text><g filter="url(#sh2)"><rect x="830" y="180" width="230" height="120" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="830" y="196" width="3" height="22" rx="1.5" fill="#96701E"/><text x="850" y="213" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Library</text><text x="850" y="238" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">every clip, by day</text><text x="850" y="258" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">lightbox, pin, restore</text><g filter="url(#sh2)"><rect x="830" y="320" width="230" height="120" rx="14" fill="url(#pf)" stroke="rgba(35,32,29,.12)"/></g><rect x="830" y="336" width="3" height="22" rx="1.5" fill="#0E8F70"/><text x="850" y="353" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#23201D">Windows OCR</text><text x="850" y="378" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">Windows.Media.Ocr</text><text x="850" y="398" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="rgba(35,32,29,.70)">offline, on your PC</text>
</svg>