<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SweaxClip: the Win+V deck itself. Older clips stack behind, each showing only its header. -->
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(128 128) scale(1.1) translate(-128 -132)">
  <!-- manila: the oldest -->
  <g filter="url(#lift)">
    <rect x="60" y="40" width="136" height="86" rx="18" fill="#EAD7A8" stroke="#3A2A1A" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="76" y="54" width="52" height="9" rx="4.5" fill="#4A3B1F" fill-opacity="0.38"/>
  </g>
  <!-- slate: code, a screen -->
  <g filter="url(#lift)">
    <rect x="44" y="70" width="168" height="90" rx="20" fill="#1D2027" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="62" y="84" width="60" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.32"/>
  </g>
  <!-- paper: the clip in front -->
  <g filter="url(#lift)">
    <rect x="24" y="104" width="208" height="120" rx="26" fill="#FFFDF8" stroke="#3A2A1A" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="52" cy="132" r="9" fill="#E4572E"/>
    <rect x="68" y="127" width="62" height="10" rx="5" fill="#23201D" fill-opacity="0.30"/>
    <rect x="44" y="156" width="164" height="14" rx="7" fill="#23201D" fill-opacity="0.78"/>
    <rect x="44" y="182" width="112" height="14" rx="7" fill="#23201D" fill-opacity="0.78"/>
  </g>
  </g>
</svg>
